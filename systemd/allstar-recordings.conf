# Retention for AllStar transcriber audio.
#
# INSTALL TO:  /etc/tmpfiles.d/allstar-recordings.conf
# (not /etc/systemd/system/ — this is a tmpfiles rule, not a unit. It lives in
# this folder only so the repo keeps all system-integration files together.)
#
# Nothing in this pipeline deletes a WAV file. Without a rule like this,
# recordings/processed/ grows forever — roughly 320 KB per transmission and
# about 100 MB per day on a moderately busy hub node.
#
# Transcripts live in MariaDB permanently; this only ages out the audio.
# 60 days is long enough to re-run a transcription benchmark against real
# captures (which is how the model comparison in CHANGES.md was done) and
# short enough to bound the directory at roughly 6 GB.
#
# Type 'e' cleans an existing directory and never creates one; the three
# dashes mean "leave mode and ownership exactly as they are", so this cannot
# disturb the asterisk-owned directories the recorder writes into.
#
# staging/ and incoming/ are deliberately absent — they hold in-flight
# recordings, not an archive.
#
# The cleanup runs from systemd-tmpfiles-clean.timer, which ships enabled on
# Debian and fires daily. There is nothing else to install or enable.
#
# Age is evaluated against the newest of atime, mtime and ctime, so a file you
# recently copied off the node for review gets its clock reset and survives
# another 60 days. That is intentional.
#
# To verify without deleting anything (safe while nothing is old enough yet):
#   systemd-tmpfiles --cat-config | grep -A2 allstar
#   ls recordings/processed/*.wav | wc -l
#   sudo systemd-tmpfiles --clean /etc/tmpfiles.d/allstar-recordings.conf
#   ls recordings/processed/*.wav | wc -l     # must be unchanged

e /opt/allstar-transcriber/recordings/processed - - - 60d
e /opt/allstar-transcriber/recordings/failed    - - - 60d
